<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Genter: the demo, frame by frame</title>
<!--
  The frames of docs/demo.gif. docs/art/render.mjs puts the lines `genter demo` printed (docs/art/demo.txt) in place
  of the frames comment below, one terminal per frame, each showing the lines printed up to that point, and screenshots
  the column of frames once. Nothing is typed into a frame that the command did not print: the window has no title and
  no prompt of its own.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0d10; }
  body { width: 940px; }
  .frame { width: 940px; height: 600px; padding: 14px; background: #0b0d10; }
  .win { height: 100%; border-radius: 10px; background: #12151a; border: 1px solid #262b33; overflow: hidden; }
  .bar { height: 30px; display: flex; gap: 7px; align-items: center; padding: 0 12px; background: #181c22; border-bottom: 1px solid #262b33; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a404a; }
  pre { padding: 12px 16px; color: #d6dae0; font: 12.5px/1.45 "DejaVu Sans Mono", "Liberation Mono", monospace; white-space: pre; }
  pre b { color: #ffffff; font-weight: 700; }
</style>
</head>
<body>
<!-- frames -->
</body>
</html>
