# A merge to main releases the version in package.json when it is new: npm publish (with provenance) and a GitHub
# release with notes, after lint, the tests and a clean install that answers with no key. A merge that keeps the
# version releases nothing. To release: raise "version" in package.json in the pull request.
# npm publishes through trusted publishing (OIDC): genter-cli on npmjs.com trusts this repository and release.yml, with
# "Allow npm publish" on. No npm token is kept anywhere; each run gets a short one, and provenance comes with it.
# Once the release job has released a version, the image job publishes genter serve's container image (Dockerfile,
# docs/team.md) to ghcr.io/genterai/genter:<version> and :latest, with the run's own token: nothing is stored either.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the tag and the release
  id-token: write # npm provenance and trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mcpb:
    # genter.mcpb, the Claude Desktop extension (manifest.json and the files npm publish ships; docs/listings.md), on the
    # release this run made: v<version> is tagged at this very commit and has no genter.mcpb yet, else the job does
    # nothing. A job of its own, after the release job, so that packing cannot fail the npm publish and "Re-run failed
    # jobs" tries it again. Outside code is @anthropic-ai/mcpb at the version pinned below and the packages it asks for by
    # range (it has no lockfile, so they float), and the token is in reach of the two steps that name it, not of that.
    # What it packed is checked against what was staged, byte for byte, before anything is uploaded.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release's files
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Does this commit's release lack genter.mcpb?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)" != "$(git rev-parse HEAD)" ]; then
            echo "$tag is not released from this commit: nothing to attach."
            echo "attach=false" >> "$GITHUB_OUTPUT"
          elif ! assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"; then
            echo "$tag has no GitHub release: nothing to attach."
            echo "attach=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$assets" | grep -qx genter.mcpb; then
            echo "$tag has genter.mcpb already."
            echo "attach=false" >> "$GITHUB_OUTPUT"
          else
            echo "attach=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage what npm ships, with the manifest
        if: steps.gate.outputs.attach == 'true'
        run: node .github/scripts/mcpb.mjs stage "$RUNNER_TEMP/genter"
      - name: Pack genter.mcpb
        if: steps.gate.outputs.attach == 'true'
        run: npx --yes --ignore-scripts @anthropic-ai/mcpb@2.1.2 pack "$RUNNER_TEMP/genter" genter.mcpb
      - name: The bundle is what was staged, byte for byte, and is this version
        if: steps.gate.outputs.attach == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          unzip -q genter.mcpb -d "$RUNNER_TEMP/unpacked"
          diff -r "$RUNNER_TEMP/genter" "$RUNNER_TEMP/unpacked"
          test "$(node "$RUNNER_TEMP/unpacked/bin/genter.js" --version)" = "${TAG#v}"
      - name: Attach it to the release
        if: steps.gate.outputs.attach == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          gh release upload "$TAG" genter.mcpb
          echo "$TAG genter.mcpb sha256 $(sha256sum genter.mcpb | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.npm == 'true' || steps.version.outputs.tag == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: "https://registry.npmjs.org", cache: npm }
      - name: npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Is this version out yet?
        id: version
        run: |
          v="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "$name@$v" version >/dev/null 2>&1; then echo "npm=false" >> "$GITHUB_OUTPUT"; else echo "npm=true" >> "$GITHUB_OUTPUT"; fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "tag=false" >> "$GITHUB_OUTPUT"; else echo "tag=true" >> "$GITHUB_OUTPUT"; fi
      - name: Nothing to release
        if: steps.version.outputs.npm == 'false' && steps.version.outputs.tag == 'false'
        run: echo "v${{ steps.version.outputs.version }} is on npm and tagged already; raise the version in package.json to release."
      - if: steps.version.outputs.npm == 'true' || steps.version.outputs.tag == 'true'
        run: npm ci
      - if: steps.version.outputs.npm == 'true' || steps.version.outputs.tag == 'true'
        run: npm run lint
      - if: steps.version.outputs.npm == 'true' || steps.version.outputs.tag == 'true'
        run: npm test
      - name: Installs with nothing else and answers with no key
        if: steps.version.outputs.npm == 'true'
        run: |
          npm pack
          mkdir -p /tmp/try && cd /tmp/try && npm init -y >/dev/null && npm i "$GITHUB_WORKSPACE"/*.tgz
          test "$(ls node_modules | wc -l)" = 1
          mkdir docs && printf '# Deploy\n\nWe deploy on Thursday.\n' > docs/deploy.md
          GENTER_HOME=/tmp/try/.genter npx genter ask "when do we deploy" | grep -q Thursday
      - name: Publish to npm
        if: steps.version.outputs.npm == 'true'
        run: npm publish --provenance --access public
      - name: Tag and GitHub release
        if: steps.version.outputs.tag == 'true'
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    # Only after the release job released this version (it ran to the end with something to release): a run that
    # releases nothing, or whose npm publish fails, publishes no image, and this job never touches the npm one.
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io/genterai/genter, with the run's GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7
      - name: Sign in to GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and push ghcr.io/genterai/genter:${{ needs.release.outputs.version }}
        # amd64 and arm64 from one Dockerfile, which runs nothing in the image while it builds, so arm64 needs no emulation.
        run: |
          v="${{ needs.release.outputs.version }}"
          docker buildx create --use --name genter
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.version=$v" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "ghcr.io/genterai/genter:$v" --tag ghcr.io/genterai/genter:latest --push .
