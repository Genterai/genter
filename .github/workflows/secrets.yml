name: secrets
# gitleaks looks for keys in the commits of every pull request and in main's whole history on every push to it, so a key
# committed by mistake fails a check before it is merged. gitleaks is built from its pinned release
# (github.com/zricethezav/gitleaks/v8@v8.30.1, its content fixed by Go's checksum database); it needs no license or
# secret, and --redact keeps what it finds out of the log. A finding that is not a key is ignored by its fingerprint in
# .gitleaksignore, with the reason.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "1.24", cache: false }
      - name: gitleaks v8.30.1
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: The pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: '"$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact --verbose --log-opts="origin/$BASE..HEAD" .'
      - name: main's whole history
        if: github.event_name != 'pull_request'
        run: '"$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact --verbose --log-opts="--full-history HEAD" .'
