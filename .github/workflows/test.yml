name: test
# The repository's tests on every pull request (Genterai/specs how/engineering/testing.md), Biome's lint (biome.jsonc), on every Node version
# package.json promises (engines: >=20), and a check of what Genter Cloud and the command use: every entry in
# "exports" imports, the packed package installs alone and imports in a clean folder, and `genter` starts and prints
# its usage.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - name: The test report's own tests
        run: node --test .github/scripts/test-report.test.mjs
      - name: Tests
        # Three reports of one run: the usual log, a page for the job summary (every test, its time and spec
        # statement), and JUnit XML for tools.
        run: npm test
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=./.github/scripts/test-report.mjs --test-reporter-destination=test-report.md
            --test-reporter=junit --test-reporter-destination=test-report.xml
          TEST_REPORT_TITLE: Тесты · Node ${{ matrix.node }}
      - name: Test report
        if: ${{ !cancelled() && hashFiles('test-report.md') != '' }}
        run: cat test-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('test-report.md') != '' }}
        with:
          name: test-report-node-${{ matrix.node }}
          path: test-report.*
      - name: Every export imports
        run: |
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; for (const e of Object.values(p.exports)) await import(e)"
      - name: The packed package installs alone and imports
        # What npm gives a person or Genter Cloud: the tarball in an empty folder, no peers, no dev packages.
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean" && npm init -y >/dev/null
          npm i "$RUNNER_TEMP"/genter-cli-*.tgz
          test "$(ls node_modules)" = genter-cli
          node --input-type=module -e 'for (const m of ["genter-cli", "genter-cli/local", "genter-cli/lexical", "genter-cli/readers"]) await import(m)'
          # The readers and language rules ship with it, and load whole.
          node --input-type=module -e 'const { loadReaders, loadRules } = await import("genter-cli/readers"); const r = loadReaders(); const l = loadRules(); if (r.problems.length || l.problems.length || r.readers.length < 6 || !l.phrases.length) { console.error(r.problems, l.problems); process.exit(1) }'
          npx --no-install genter --version
      - name: The command starts
        run: node bin/genter.js
